name: CI

# Validates the package on every push and pull request. No dependencies are
# installed: the bundle has none, and the checks only need Node.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify package invariants
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node scripts/verify.mjs "$RUNNER_TEMP/pack.json"

      - name: Build the tarball
        run: npm pack --pack-destination dist

      - name: Show the tarball contents
        run: |
          set -euo pipefail
          tar -tzf dist/*.tgz | sort
          sha256sum dist/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-theme-linen-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
